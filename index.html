<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Wisp Space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(0,0,0,.12);
      border-top-color: black;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <iframe
    id="proxyFrame"
    src="https://frames-jade.vercel.app/"
  ></iframe>

  <script>
    const frame = document.getElementById("proxyFrame");
    const loader = document.getElementById("loader");

    frame.onload = () => {
      loader.remove();
    };
  </script>
</body>
</html>
