<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Wisp Space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      background: transparent;
    }

    iframe.loaded {
      opacity: 1;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.2s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(0, 0, 0, 0.12);
      border-top: 4px solid #000;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <iframe
    id="proxyFrame"
    src="https://frames-jade.vercel.app/"
  ></iframe>

  <script>
    const frame = document.getElementById("proxyFrame");
    const loader = document.getElementById("loader");

    frame.onload = () => {
      frame.classList.add("loaded");

      setTimeout(() => {
        loader.classList.add("hidden");
      }, 100);
    };
  </script>
</body>
</html>
