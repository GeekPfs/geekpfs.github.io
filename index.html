<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wisp Space</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background: #000;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    iframe.loaded + .loading {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <iframe
    id="WispSpace"
    src="https://frames-jade.vercel.app/api/proxy/"
    allowfullscreen
  ></iframe>

  <div class="loading">
    <div class="spinner"></div>
  </div>

  <script>
    const iframe = document.getElementById("WispSpace");
    const loading = document.querySelector(".loading");

    iframe.onload = () => {
      iframe.classList.add("loaded");

      setTimeout(() => {
        loading.style.display = "none";
      }, 400);
    };
  </script>

</body>
</html>
