<!DOCTYPE html>
<html>
<head>
  <title>Página Externa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(0,0,0,.15);
      border-top: 4px solid black;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="spinner"></div>
  </div>

  <iframe
    id="proxyFrame"
    src="https://frames-jade.vercel.app/"
  ></iframe>

  <script>
    const frame = document.getElementById("proxyFrame");
    const loader = document.getElementById("loader");

    frame.onload = () => {
      loader.remove();
    };
  </script>
</body>
</html>
